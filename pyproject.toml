[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chesscoach"
version = "0.1.0"
description = "Interpretable White-Box Hybrid Chess Coach (Stockfish Search Interrogation + 6D Classical Positional Evaluator)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.11.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pywebview>=5.0.0",
]

[project.scripts]
chesscoach = "chesscoach.desktop:main"
chesscoach-cli = "analyze_game:main"
